<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitações — Nexmon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__brand">NEX<span>MON</span></a>
      <div class="navbar__search">
        <input type="search" id="search" placeholder="Buscar relíquias..." autocomplete="off">
      </div>
      <div class="navbar__actions">
        <a href="login.html" class="btn btn--primary" id="nav-login-btn">Entrar</a>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 32px; max-width: 900px;">
    <h1 style="font-size: 1.2rem; margin-bottom: 24px;">Central de Transações</h1>

    <!-- Abas -->
    <div class="tabs">
      <button class="tabs__btn is-active" data-tab="recebidas">Recebidas (Prestador)</button>
      <button class="tabs__btn" data-tab="enviadas">Enviadas (Locatário)</button>
    </div>

    <!-- Conteúdo: Recebidas -->
    <div id="tab-recebidas" class="tab-content">
      <!-- Os cards serão injetados pelo JS aqui -->
    </div>

    <!-- Conteúdo: Enviadas -->
    <div id="tab-enviadas" class="tab-content" style="display: none;">
      <!-- Os cards serão injetados pelo JS aqui -->
    </div>

  </main>

  <footer class="footer">
    <div class="container">© 2026 Nexmon — Projeto acadêmico APS.</div>
  </footer>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
