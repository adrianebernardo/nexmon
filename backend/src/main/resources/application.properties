spring.application.name=nexmon-api
server.port=${PORT:8080}

# ============================================================
# BANCO PADRÃO: MySQL
# Crie um arquivo ".env" ao lado do pom.xml (modelo: .env.example) com DB_USER e DB_PASSWORD,
# ou defina essas variáveis de ambiente. O banco "nexmon_db" é criado sozinho se não existir.
# ============================================================
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexmon_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# "update" cria as tabelas na primeira vez e só acrescenta o que faltar depois (não apaga dados).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Sem dados de exemplo no MySQL (o catálogo começa vazio). Para testar com dados: perfil "h2".
spring.sql.init.mode=never

# (opcional) pasta do frontend a servir em http://localhost:8080. Por padrão procura ../frontend e ./frontend
# nexmon.frontend.dir=../frontend
