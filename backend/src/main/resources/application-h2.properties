# ============================================================
# PERFIL "h2": banco em memória + dados de demonstração.
# Rodar:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Os dados somem toda vez que a aplicação é parada.
# Usuários de teste (senha 12345678): ana@email.com, bruno@email.com, carla@email.com, diego@email.com
# ============================================================
spring.datasource.url=jdbc:h2:mem:nexmon_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O arquivo de dados precisa rodar DEPOIS do Hibernate criar as tabelas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:dados-demo.sql
