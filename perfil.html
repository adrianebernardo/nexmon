<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Nexmon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__brand">NEX<span>MON</span></a>
      <div class="navbar__search">
        <input type="search" id="search" placeholder="Buscar relíquias..." autocomplete="off">
      </div>
      <div class="navbar__actions">
        <a href="login.html" class="btn btn--primary" id="nav-login-btn">Entrar</a>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 32px; max-width: 900px;">
    
    <!-- Cabeçalho do Perfil -->
    <div class="profile-header">
      <div class="profile-avatar">👤</div>
      <div class="profile-info">
        <h1 id="profile-name" style="font-size: 1.2rem;">Carregando...</h1>
        <p class="muted" id="profile-role" style="font-family: var(--font-pixel); font-size: 0.6rem; margin-top: 8px;">CARREGANDO...</p>
      </div>
      <div style="margin-left: auto;">
        <a href="novo-anuncio.html" class="btn btn--primary" style="font-size: 0.6rem;">+ Novo Anúncio</a>
      </div>
    </div>

    <!-- Selos e Conquistas -->
    <div class="booking-box" style="margin-bottom: 32px; padding: 24px;">
      <h2 style="font-size: 0.9rem; color: var(--lilac); margin-bottom: 16px;">Insígnias da Guilda</h2>
      <div class="badges-grid" id="profile-badges">
        <!-- Inseridos via JS -->
      </div>
    </div>

    <!-- Meus Anúncios -->
    <div style="margin-bottom: 32px;">
      <div class="section-title">
        <h2>Meus Anúncios Publicados</h2>
      </div>
      <div class="product-grid" id="my-products-grid">
        <!-- Inseridos via JS -->
      </div>
    </div>

  </main>

  <footer class="footer">
    <div class="container">© 2026 Nexmon — Projeto acadêmico APS.</div>
  </footer>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
